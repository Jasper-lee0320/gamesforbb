<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧩 蓓蓓的记忆翻牌</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #ffb3d9 0%, #ff80cc 50%, #ff66c4 100%);
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(255, 105, 180, 0.3);
            max-width: 600px;
            width: 100%;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 182, 193, 0.5);
        }

        .game-title {
            color: #ff1493;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            font-weight: bold;
        }

        .game-subtitle {
            color: #ff69b4;
            font-size: 1.2em;
            margin-bottom: 20px;
        }

        .difficulty-selector {
            margin-bottom: 20px;
        }

        .difficulty-btn {
            background: linear-gradient(145deg, #ff69b4, #ff1493);
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 20, 147, 0.3);
        }

        .difficulty-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 20, 147, 0.4);
        }

        .difficulty-btn.active {
            background: linear-gradient(145deg, #ff1493, #dc143c);
            transform: scale(1.05);
        }

        .game-stats {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            background: rgba(255, 182, 193, 0.3);
            padding: 15px;
            border-radius: 15px;
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
            margin: 5px;
        }

        .stat-label {
            font-size: 14px;
            color: #ff1493;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .stat-value {
            font-size: 20px;
            color: #dc143c;
            font-weight: bold;
            background: white;
            padding: 8px 15px;
            border-radius: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .game-controls {
            margin: 20px 0;
        }

        .control-btn {
            background: linear-gradient(145deg, #ff69b4, #ff1493);
            color: white;
            border: none;
            padding: 12px 24px;
            margin: 5px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 20, 147, 0.3);
        }

        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 20, 147, 0.4);
        }

        .control-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .game-board {
            display: grid;
            gap: 10px;
            margin: 20px auto;
            max-width: 500px;
            padding: 20px;
            background: rgba(255, 182, 193, 0.2);
            border-radius: 20px;
            border: 2px solid rgba(255, 105, 180, 0.3);
        }

        .memory-card {
            aspect-ratio: 1;
            background: linear-gradient(145deg, #ffb6c1, #ffc0cb);
            border: 3px solid #ff69b4;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 2.5em;
            transition: all 0.6s ease;
            position: relative;
            overflow: hidden;
            min-height: 60px;
        }

        .memory-card:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(255, 105, 180, 0.4);
        }

        .memory-card.flipped {
            background: linear-gradient(145deg, #fff, #ffe4e1);
            border-color: #ff1493;
            transform: rotateY(180deg);
            animation: flipIn 0.6s ease;
        }

        .memory-card.matched {
            background: linear-gradient(145deg, #90ee90, #98fb98);
            border-color: #32cd32;
            animation: matchSuccess 0.8s ease;
            cursor: default;
        }

        .memory-card.wrong {
            animation: wrongShake 0.5s ease;
        }

        .card-back {
            background: linear-gradient(45deg, #ff69b4, #ff1493);
            color: white;
            font-size: 1.5em;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .card-front {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .memory-card.flipped .card-front {
            opacity: 1;
        }

        .memory-card.flipped .card-back {
            opacity: 0;
        }

        @keyframes flipIn {
            0% { transform: rotateY(0deg); }
            50% { transform: rotateY(90deg) scale(1.1); }
            100% { transform: rotateY(180deg); }
        }

        @keyframes matchSuccess {
            0% { transform: scale(1); }
            50% { transform: scale(1.2) rotate(5deg); }
            100% { transform: scale(1); }
        }

        @keyframes wrongShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #ff69b4;
            border-radius: 50%;
            pointer-events: none;
            animation: particleFly 1s ease-out forwards;
        }

        @keyframes particleFly {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--dx), var(--dy)) scale(0);
            }
        }

        .game-over {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .game-over-content {
            background: white;
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            max-width: 400px;
            margin: 20px;
        }

        .game-over h2 {
            color: #ff1493;
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .game-over p {
            color: #666;
            font-size: 1.2em;
            margin: 10px 0;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: rgba(255, 182, 193, 0.3);
            border-radius: 5px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff69b4, #ff1493);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 5px;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .game-container {
                margin: 10px;
                padding: 15px;
            }
            
            .game-title {
                font-size: 2em;
            }
            
            .memory-card {
                font-size: 2em;
                min-height: 50px;
            }
            
            .game-stats {
                flex-direction: column;
                gap: 10px;
            }
            
            .stat-item {
                margin: 5px 0;
            }
        }

        @media (max-width: 480px) {
            .memory-card {
                font-size: 1.8em;
                min-height: 45px;
            }
            
            .game-title {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" style="position:fixed;left:15px;top:15px;background:rgba(255,255,255,0.9);border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:20px;z-index:200;box-shadow:0 2px 8px rgba(0,0,0,0.15);">🏠</a>
    <div class="game-container">
        <h1 class="game-title">🧩 蓓蓓的记忆翻牌</h1>
        <p class="game-subtitle">找出相同的图案，训练你的记忆力！</p>

        <div class="difficulty-selector">
            <span style="color: #ff1493; font-weight: bold;">难度选择：</span>
            <button class="difficulty-btn active" onclick="setDifficulty('easy')">简单 4×3</button>
            <button class="difficulty-btn" onclick="setDifficulty('normal')">普通 4×4</button>
            <button class="difficulty-btn" onclick="setDifficulty('hard')">困难 6×4</button>
        </div>

        <div class="game-stats">
            <div class="stat-item">
                <div class="stat-label">⏱️ 时间</div>
                <div class="stat-value" id="timeDisplay">00:00</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">🔄 翻牌次数</div>
                <div class="stat-value" id="flipsDisplay">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">🎯 匹配数</div>
                <div class="stat-value" id="matchesDisplay">0/0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">⭐ 分数</div>
                <div class="stat-value" id="scoreDisplay">0</div>
            </div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="game-controls">
            <button class="control-btn" onclick="newGame()">🆕 新游戏</button>
            <button class="control-btn" onclick="pauseGame()" id="pauseBtn">⏸️ 暂停</button>
            <button class="control-btn" onclick="showHint()" id="hintBtn">💡 提示</button>
        </div>

        <div class="game-board" id="gameBoard">
            <!-- 卡片将通过 JavaScript 动态生成 -->
        </div>
    </div>

    <div class="game-over" id="gameOverModal">
        <div class="game-over-content">
            <h2 id="gameOverTitle">🎉 恭喜完成！</h2>
            <p id="gameOverText">你的记忆力太棒了！</p>
            <p id="gameOverStats"></p>
            <div style="margin-top: 20px;">
                <button class="control-btn" onclick="newGame(); closeGameOver()">🆕 再来一局</button>
                <button class="control-btn" onclick="closeGameOver()">❌ 关闭</button>
            </div>
        </div>
    </div>

    <script>
        console.log('🧩 蓓蓓的记忆翻牌游戏初始化开始...');

        // 游戏配置
        const difficulties = {
            easy: { rows: 3, cols: 4, pairs: 6, timeBonus: 100 },
            normal: { rows: 4, cols: 4, pairs: 8, timeBonus: 150 },
            hard: { rows: 4, cols: 6, pairs: 12, timeBonus: 200 }
        };

        // 可爱的图案集合
        const cardSymbols = [
            '💖', '💕', '💗', '💓', '💝', '💘', '💌', '💟',
            '❤️', '🧡', '💛', '💚', '💙', '💜', '🤍', '🖤',
            '❣️', '💋', '🌹', '🌸', '🌺', '🌻', '🌷', '🥀',
            '🎀', '💎', '⭐', '✨', '🌟', '💫', '🦋', '🌈',
            '🍓', '🍑', '🍒', '🥰', '😘', '💐', '🌼', '🌱'
        ];

        // 游戏状态
        let currentDifficulty = 'easy';
        let gameBoard = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let totalPairs = 0;
        let flipCount = 0;
        let score = 0;
        let gameStartTime = 0;
        let gameTimer = null;
        let isPaused = false;
        let canFlip = true;
        let hintUsed = false;

        // 音频上下文（用于音效）
        let audioContext;

        console.log('游戏配置初始化完成', {
            difficulties,
            cardSymbols: cardSymbols.slice(0, 5) + '...',
            totalSymbols: cardSymbols.length
        });

        function initAudio() {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                console.log('音频上下文初始化成功');
            } catch (e) {
                console.warn('音频不支持:', e);
            }
        }

        function playSound(type) {
            if (!audioContext) return;

            console.log('播放音效:', type);
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            switch (type) {
                case 'flip':
                    oscillator.frequency.setValueAtTime(600, audioContext.currentTime);
                    gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.2);
                    break;
                case 'match':
                    oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(1200, audioContext.currentTime + 0.3);
                    gainNode.gain.setValueAtTime(0.15, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.3);
                    break;
                case 'wrong':
                    oscillator.frequency.setValueAtTime(300, audioContext.currentTime);
                    gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.4);
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.4);
                    break;
                case 'complete':
                    // 胜利音效
                    [800, 1000, 1200, 1500].forEach((freq, i) => {
                        const osc = audioContext.createOscillator();
                        const gain = audioContext.createGain();
                        osc.connect(gain);
                        gain.connect(audioContext.destination);
                        osc.frequency.setValueAtTime(freq, audioContext.currentTime + i * 0.15);
                        gain.gain.setValueAtTime(0.1, audioContext.currentTime + i * 0.15);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + i * 0.15 + 0.3);
                        osc.start(audioContext.currentTime + i * 0.15);
                        osc.stop(audioContext.currentTime + i * 0.15 + 0.3);
                    });
                    break;
            }
        }

        function setDifficulty(level) {
            console.log('设置难度:', level);
            currentDifficulty = level;
            document.querySelectorAll('.difficulty-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            newGame();
        }

        function newGame() {
            console.log('🎮 开始新游戏, 难度:', currentDifficulty);
            
            initAudio();
            const config = difficulties[currentDifficulty];
            const boardElement = document.getElementById('gameBoard');
            
            console.log('游戏配置:', config);
            
            // 设置网格
            boardElement.style.gridTemplateColumns = `repeat(${config.cols}, 1fr)`;
            boardElement.style.gridTemplateRows = `repeat(${config.rows}, 1fr)`;
            
            // 重置游戏状态
            gameBoard = [];
            flippedCards = [];
            matchedPairs = 0;
            totalPairs = config.pairs;
            flipCount = 0;
            score = 0;
            hintUsed = false;
            canFlip = true;
            isPaused = false;
            
            console.log('游戏状态重置完成', {
                totalPairs,
                boardSize: `${config.rows}x${config.cols}`
            });
            
            // 生成卡片对
            const cards = [];
            for (let i = 0; i < config.pairs; i++) {
                const symbol = cardSymbols[i % cardSymbols.length];
                cards.push(symbol, symbol); // 添加一对
            }
            
            console.log('生成的卡片对:', cards);
            
            // 随机打乱
            for (let i = cards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [cards[i], cards[j]] = [cards[j], cards[i]];
            }
            
            console.log('打乱后的卡片:', cards);
            
            // 创建游戏板
            boardElement.innerHTML = '';
            for (let i = 0; i < config.rows * config.cols; i++) {
                const card = document.createElement('div');
                card.className = 'memory-card';
                card.dataset.index = i;
                
                if (i < cards.length) {
                    card.dataset.symbol = cards[i];
                    card.innerHTML = `
                        <div class="card-back">💝</div>
                        <div class="card-front">${cards[i]}</div>
                    `;
                    card.addEventListener('click', () => flipCard(i));
                    console.log(`卡片 ${i}: ${cards[i]}`);
                } else {
                    card.style.visibility = 'hidden'; // 隐藏多余的格子
                    console.log(`隐藏卡片 ${i}`);
                }
                
                boardElement.appendChild(card);
                gameBoard.push(card);
            }
            
            updateUI();
            startTimer();
            
            console.log('✅ 新游戏创建完成!');
        }

        function flipCard(index) {
            console.log('🔄 翻牌操作:', index);
            
            if (!canFlip || isPaused) {
                console.log('❌ 无法翻牌: canFlip=' + canFlip + ', isPaused=' + isPaused);
                return;
            }
            
            const card = gameBoard[index];
            if (!card || card.classList.contains('flipped') || card.classList.contains('matched')) {
                console.log('❌ 卡片状态不允许翻牌:', card?.className);
                return;
            }
            
            // 翻牌
            card.classList.add('flipped');
            flippedCards.push(index);
            flipCount++;
            
            console.log('✅ 翻牌成功:', {
                index,
                symbol: card.dataset.symbol,
                flippedCards: flippedCards.length,
                flipCount
            });
            
            playSound('flip');
            
            if (flippedCards.length === 2) {
                console.log('🎯 检查匹配: 两张卡片已翻开');
                canFlip = false;
                setTimeout(() => checkMatch(), 800);
            }
            
            updateUI();
        }

        function checkMatch() {
            console.log('🔍 开始匹配检查...');
            
            const [index1, index2] = flippedCards;
            const card1 = gameBoard[index1];
            const card2 = gameBoard[index2];
            
            console.log('检查的卡片:', {
                card1: { index: index1, symbol: card1.dataset.symbol },
                card2: { index: index2, symbol: card2.dataset.symbol }
            });
            
            if (card1.dataset.symbol === card2.dataset.symbol) {
                // 匹配成功
                console.log('✅ 匹配成功!');
                
                card1.classList.add('matched');
                card2.classList.add('matched');
                
                // 创建粒子效果
                createParticles(card1);
                createParticles(card2);
                
                matchedPairs++;
                score += 100 + (hintUsed ? 0 : 50); // 未使用提示额外奖励
                
                console.log('匹配统计:', {
                    matchedPairs,
                    totalPairs,
                    score,
                    progress: (matchedPairs / totalPairs * 100) + '%'
                });
                
                playSound('match');
                
                // 检查游戏是否完成
                if (matchedPairs === totalPairs) {
                    console.log('🎉 游戏完成!');
                    setTimeout(() => gameComplete(), 500);
                }
            } else {
                // 匹配失败
                console.log('❌ 匹配失败');
                
                card1.classList.add('wrong');
                card2.classList.add('wrong');
                
                playSound('wrong');
                
                setTimeout(() => {
                    card1.classList.remove('flipped', 'wrong');
                    card2.classList.remove('flipped', 'wrong');
                    console.log('🔄 卡片重新翻回');
                }, 1000);
            }
            
            flippedCards = [];
            canFlip = true;
            updateUI();
        }

        function createParticles(card) {
            console.log('✨ 创建粒子效果');
            
            const rect = card.getBoundingClientRect();
            const boardRect = document.getElementById('gameBoard').getBoundingClientRect();
            
            for (let i = 0; i < 6; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                const x = rect.left + rect.width / 2 - boardRect.left;
                const y = rect.top + rect.height / 2 - boardRect.top;
                
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                
                const angle = (i / 6) * Math.PI * 2;
                const distance = 50 + Math.random() * 30;
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance;
                
                particle.style.setProperty('--dx', dx + 'px');
                particle.style.setProperty('--dy', dy + 'px');
                
                document.getElementById('gameBoard').appendChild(particle);
                
                setTimeout(() => particle.remove(), 1000);
            }
        }

        function showHint() {
            if (hintUsed || isPaused) {
                console.log('❌ 提示不可用: hintUsed=' + hintUsed + ', isPaused=' + isPaused);
                return;
            }
            
            console.log('💡 显示提示');
            hintUsed = true;
            
            // 找到第一对未匹配的卡片
            const symbols = {};
            const availableCards = [];
            
            gameBoard.forEach((card, index) => {
                if (card.dataset.symbol && !card.classList.contains('matched')) {
                    const symbol = card.dataset.symbol;
                    if (!symbols[symbol]) {
                        symbols[symbol] = [];
                    }
                    symbols[symbol].push(index);
                    availableCards.push({ index, symbol });
                }
            });
            
            console.log('可用卡片分析:', symbols);
            
            // 找到第一对
            for (const symbol in symbols) {
                if (symbols[symbol].length >= 2) {
                    const [index1, index2] = symbols[symbol];
                    const card1 = gameBoard[index1];
                    const card2 = gameBoard[index2];
                    
                    console.log('提示卡片对:', { index1, index2, symbol });
                    
                    // 短暂显示提示
                    card1.style.boxShadow = '0 0 20px #ffff00';
                    card2.style.boxShadow = '0 0 20px #ffff00';
                    
                    setTimeout(() => {
                        card1.style.boxShadow = '';
                        card2.style.boxShadow = '';
                    }, 2000);
                    
                    break;
                }
            }
            
            document.getElementById('hintBtn').disabled = true;
            document.getElementById('hintBtn').textContent = '💡 已使用';
        }

        function startTimer() {
            console.log('⏱️ 开始计时');
            gameStartTime = Date.now();
            clearInterval(gameTimer);
            
            gameTimer = setInterval(() => {
                if (!isPaused) {
                    const elapsed = Math.floor((Date.now() - gameStartTime) / 1000);
                    const minutes = Math.floor(elapsed / 60);
                    const seconds = elapsed % 60;
                    document.getElementById('timeDisplay').textContent = 
                        `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                }
            }, 1000);
        }

        function pauseGame() {
            isPaused = !isPaused;
            const pauseBtn = document.getElementById('pauseBtn');
            
            console.log('⏸️ 游戏暂停状态:', isPaused);
            
            if (isPaused) {
                pauseBtn.textContent = '▶️ 继续';
                // 隐藏所有卡片内容
                gameBoard.forEach(card => {
                    if (!card.classList.contains('matched')) {
                        card.style.filter = 'blur(10px)';
                    }
                });
            } else {
                pauseBtn.textContent = '⏸️ 暂停';
                // 恢复卡片显示
                gameBoard.forEach(card => {
                    card.style.filter = '';
                });
            }
        }

        function updateUI() {
            console.log('🔄 更新UI', {
                flipCount,
                matchedPairs,
                totalPairs,
                score
            });
            
            document.getElementById('flipsDisplay').textContent = flipCount;
            document.getElementById('matchesDisplay').textContent = `${matchedPairs}/${totalPairs}`;
            document.getElementById('scoreDisplay').textContent = score;
            
            const progress = totalPairs > 0 ? (matchedPairs / totalPairs) * 100 : 0;
            document.getElementById('progressFill').style.width = progress + '%';
        }

        function gameComplete() {
            console.log('🎉 游戏完成统计开始...');
            
            clearInterval(gameTimer);
            const finalTime = Math.floor((Date.now() - gameStartTime) / 1000);
            const timeBonus = Math.max(0, difficulties[currentDifficulty].timeBonus - finalTime);
            const finalScore = score + timeBonus;
            
            const stats = {
                finalTime,
                flipCount,
                timeBonus,
                finalScore,
                hintUsed,
                difficulty: currentDifficulty
            };
            
            console.log('🏆 最终统计:', stats);
            
            playSound('complete');
            
            document.getElementById('gameOverTitle').textContent = '🎉 恭喜完成！';
            document.getElementById('gameOverText').textContent = 
                `太棒了！你的记忆力超强！`;
            document.getElementById('gameOverStats').innerHTML = 
                `⏱️ 用时: ${Math.floor(finalTime/60)}:${(finalTime%60).toString().padStart(2,'0')}<br>
                 🔄 翻牌: ${flipCount} 次<br>
                 ⭐ 最终分数: ${finalScore}<br>
                 💡 ${hintUsed ? '使用了提示' : '未使用提示 +50分'}`;
            
            document.getElementById('gameOverModal').style.display = 'flex';
        }

        function closeGameOver() {
            console.log('关闭游戏结束弹窗');
            document.getElementById('gameOverModal').style.display = 'none';
        }

        // 初始化游戏
        console.log('🚀 初始化游戏...');
        document.addEventListener('DOMContentLoaded', () => {
            console.log('📱 DOM加载完成，开始新游戏');
            newGame();
        });

        // 如果DOM已经加载完成
        if (document.readyState === 'loading') {
            console.log('⏳ 等待DOM加载...');
        } else {
            console.log('📱 DOM已就绪，立即开始新游戏');
            newGame();
        }

        console.log('✅ 蓓蓓的记忆翻牌游戏脚本加载完成!');
    </script>
</body>
</html>
