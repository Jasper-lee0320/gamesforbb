<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>家林数字点击 - Number Click</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Arial Rounded MT Bold', 'Comic Sans MS', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
            touch-action: none;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 顶部控制栏 */
        .top-bar {
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }

        .game-title {
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .controls {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 8px 15px;
            border: none;
            border-radius: 20px;
            background: white;
            color: #667eea;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            transition: all 0.2s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn.active {
            background: #ffd700;
            color: #333;
        }

        /* 设置面板 */
        .settings-panel {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .settings-panel.show {
            display: flex;
        }

        .settings-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
        }

        .settings-content h2 {
            margin-bottom: 20px;
            color: #667eea;
        }

        .setting-item {
            margin: 15px 0;
        }

        .setting-item label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        .setting-item select {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 2px solid #667eea;
            font-size: 16px;
        }

        /* 游戏区域 */
        .game-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        /* 提示区域 */
        .prompt-area {
            margin-bottom: 20px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .prompt-text {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            text-align: center;
        }

        /* 数字网格 */
        .numbers-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            max-width: 600px;
            width: 100%;
        }

        .number-btn {
            aspect-ratio: 1;
            border: none;
            border-radius: 20px;
            background: white;
            font-size: 72px;
            font-weight: bold;
            color: #667eea;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .number-btn:active {
            transform: scale(0.95);
        }

        .number-btn.pop {
            animation: pop 0.3s ease;
        }

        .number-btn.correct {
            animation: correct 0.5s ease;
        }

        .number-btn.wrong {
            animation: wrong 0.5s ease;
        }

        @keyframes pop {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        @keyframes correct {
            0%, 100% { transform: scale(1); background: white; }
            50% { transform: scale(1.3); background: #4ade80; color: white; }
        }

        @keyframes wrong {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* 彩屑粒子 */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 999;
        }

        /* 响应式 */
        @media (max-width: 480px) {
            .number-btn {
                font-size: 56px;
            }
            
            .prompt-text {
                font-size: 24px;
            }
        }

        /* 加载屏幕 */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            color: white;
        }

        .loading-screen h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .loading-text {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .start-btn {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 24px;
            border: none;
            border-radius: 30px;
            background: white;
            color: #667eea;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.2s;
        }

        .start-btn:active {
            transform: scale(0.95);
        }

        /* 长按设置按钮 */
        .settings-btn {
            position: fixed;
            top: 10px;
            right: 10px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .settings-btn.holding {
            background: rgba(255,255,255,0.8);
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <!-- 加载屏幕 -->
    <div class="loading-screen" id="loadingScreen">
        <h1>🎯</h1>
        <div class="loading-text">家林数字点击</div>
        <div class="loader"></div>
        <button class="start-btn" id="startBtn">开始游戏</button>
    </div>

    <a href="index.html" style="position:fixed;left:10px;top:10px;background:rgba(255,255,255,0.9);border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:20px;z-index:500;box-shadow:0 2px 8px rgba(0,0,0,0.15);">🏠</a>
    <!-- 长按进入设置 -->
    <button class="settings-btn" id="settingsBtn">⚙️</button>

    <!-- 游戏主界面 -->
    <div class="top-bar">
        <div class="game-title">家林数字点击 🎯</div>
        <div class="controls">
            <button class="btn active" id="learnModeBtn">学习模式</button>
            <button class="btn" id="practiceModeBtn">练习模式</button>
        </div>
    </div>

    <div class="game-container">
        <!-- 提示区域 -->
        <div class="prompt-area">
            <div class="prompt-text" id="promptText">点击数字学习！</div>
        </div>

        <!-- 数字网格 -->
        <div class="numbers-grid" id="numbersGrid">
            <!-- 通过JS生成 -->
        </div>
    </div>

    <!-- 设置面板 -->
    <div class="settings-panel" id="settingsPanel">
        <div class="settings-content">
            <h2>家长设置</h2>
            
            <div class="setting-item">
                <label>语言选择：</label>
                <select id="languageSelect">
                    <option value="zh">中文（普通话）</option>
                    <option value="en">English</option>
                    <option value="yue">粤语</option>
                </select>
            </div>

            <div class="setting-item">
                <label>数字范围：</label>
                <select id="rangeSelect">
                    <option value="5">1-5（推荐）</option>
                    <option value="9">1-9</option>
                    <option value="10" selected>1-10</option>
                </select>
            </div>

            <div class="setting-item">
                <label>音量：</label>
                <input type="range" id="volumeSlider" min="0" max="100" value="80" style="width: 100%;">
            </div>

            <button class="btn" onclick="closeSettings()" style="width: 100%; margin-top: 20px; padding: 12px;">关闭</button>
        </div>
    </div>

    <script>
        // ========== 全局状态 ==========
        const state = {
            mode: 'learn', // 'learn' or 'practice'
            language: 'zh',
            maxNumber: 10,
            volume: 0.8,
            currentTarget: null,
            locked: false,
            audioContext: null,
            initialized: false
        };

        // ========== 音频管理 ==========
        const audioCache = new Map();
        let currentAudio = null;

        // 数字发音映射（使用Web Speech API作为备选）
        const numberWords = {
            zh: ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'],
            en: ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'],
            yue: ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'] // 粤语同字
        };

        const langCodes = {
            zh: 'zh-CN',
            en: 'en-US',
            yue: 'zh-HK'
        };

        // 使用 Web Speech API 播放
        function speakNumber(num) {
            if (!window.speechSynthesis) return;
            
            // 停止当前播放
            speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(numberWords[state.language][num]);
            utterance.lang = langCodes[state.language];
            utterance.rate = 0.8;
            utterance.volume = state.volume;
            
            speechSynthesis.speak(utterance);
        }

        // 播放音效
        function playSound(type) {
            const frequencies = {
                click: 400,
                correct: 600,
                wrong: 200,
                cheer: 800
            };

            if (!state.audioContext) return;

            const oscillator = state.audioContext.createOscillator();
            const gainNode = state.audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(state.audioContext.destination);

            oscillator.frequency.value = frequencies[type];
            oscillator.type = 'sine';

            gainNode.gain.setValueAtTime(state.volume * 0.3, state.audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, state.audioContext.currentTime + 0.2);

            oscillator.start(state.audioContext.currentTime);
            oscillator.stop(state.audioContext.currentTime + 0.2);
        }

        // ========== 彩屑效果 ==========
        function createConfetti(x, y, isCorrect = true) {
            const colors = isCorrect 
                ? ['#ffd700', '#ff6b6b', '#4ade80', '#60a5fa', '#a78bfa']
                : ['#999', '#666'];
            
            const count = isCorrect ? 20 : 5;

            for (let i = 0; i < count; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = x + 'px';
                confetti.style.top = y + 'px';
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                
                document.body.appendChild(confetti);

                const angle = (Math.PI * 2 * i) / count;
                const velocity = 100 + Math.random() * 100;
                const vx = Math.cos(angle) * velocity;
                const vy = Math.sin(angle) * velocity;

                animateConfetti(confetti, vx, vy);
            }
        }

        function animateConfetti(element, vx, vy) {
            let x = parseFloat(element.style.left);
            let y = parseFloat(element.style.top);
            let opacity = 1;
            let startTime = Date.now();

            function update() {
                const elapsed = (Date.now() - startTime) / 1000;
                
                x += vx * 0.016;
                y += vy * 0.016 + 200 * elapsed * elapsed; // 重力
                opacity -= 0.016 * 2;

                element.style.left = x + 'px';
                element.style.top = y + 'px';
                element.style.opacity = opacity;

                if (opacity > 0 && y < window.innerHeight) {
                    requestAnimationFrame(update);
                } else {
                    element.remove();
                }
            }

            requestAnimationFrame(update);
        }

        // ========== 游戏逻辑 ==========
        function initGame() {
            const grid = document.getElementById('numbersGrid');
            grid.innerHTML = '';

            for (let i = 1; i <= state.maxNumber; i++) {
                const btn = document.createElement('button');
                btn.className = 'number-btn';
                btn.textContent = i;
                btn.dataset.num = i;
                btn.addEventListener('click', () => handleNumberClick(i, btn));
                grid.appendChild(btn);
            }

            // 如果是练习模式，开始新题目
            if (state.mode === 'practice') {
                nextPracticeQuestion();
            }
        }

        function handleNumberClick(num, element) {
            if (state.locked) return;
            state.locked = true;

            const rect = element.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;

            if (state.mode === 'learn') {
                // 学习模式：直接反馈
                element.classList.add('pop');
                playSound('click');
                speakNumber(num);
                createConfetti(x, y, true);

                setTimeout(() => {
                    element.classList.remove('pop');
                    state.locked = false;
                }, 500);

            } else if (state.mode === 'practice') {
                // 练习模式：检查答案
                if (num === state.currentTarget) {
                    // 正确
                    element.classList.add('correct');
                    playSound('correct');
                    speakNumber(num);
                    createConfetti(x, y, true);
                    
                    document.getElementById('promptText').textContent = '太棒了！🎉';

                    setTimeout(() => {
                        element.classList.remove('correct');
                        nextPracticeQuestion();
                        state.locked = false;
                    }, 1000);

                } else {
                    // 错误
                    element.classList.add('wrong');
                    playSound('wrong');
                    createConfetti(x, y, false);

                    document.getElementById('promptText').textContent = '再试试看！';

                    setTimeout(() => {
                        element.classList.remove('wrong');
                        state.locked = false;
                    }, 500);
                }
            }
        }

        function nextPracticeQuestion() {
            state.currentTarget = Math.floor(Math.random() * state.maxNumber) + 1;
            const word = numberWords[state.language][state.currentTarget];
            document.getElementById('promptText').textContent = `找到数字：${state.currentTarget}`;
            
            // 播放提示音
            setTimeout(() => speakNumber(state.currentTarget), 300);
        }

        // ========== 模式切换 ==========
        function switchMode(mode) {
            state.mode = mode;
            
            document.getElementById('learnModeBtn').classList.toggle('active', mode === 'learn');
            document.getElementById('practiceModeBtn').classList.toggle('active', mode === 'practice');

            if (mode === 'learn') {
                document.getElementById('promptText').textContent = '点击数字学习！';
            } else {
                document.getElementById('promptText').textContent = '准备开始练习...';
                setTimeout(() => nextPracticeQuestion(), 500);
            }
        }

        // ========== 设置管理 ==========
        let settingsHoldTimer = null;

        document.getElementById('settingsBtn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            settingsHoldTimer = setTimeout(() => {
                document.getElementById('settingsBtn').classList.add('holding');
                openSettings();
            }, 2000);
        });

        document.getElementById('settingsBtn').addEventListener('touchend', (e) => {
            e.preventDefault();
            clearTimeout(settingsHoldTimer);
            document.getElementById('settingsBtn').classList.remove('holding');
        });

        document.getElementById('settingsBtn').addEventListener('mousedown', () => {
            settingsHoldTimer = setTimeout(() => {
                document.getElementById('settingsBtn').classList.add('holding');
                openSettings();
            }, 2000);
        });

        document.getElementById('settingsBtn').addEventListener('mouseup', () => {
            clearTimeout(settingsHoldTimer);
            document.getElementById('settingsBtn').classList.remove('holding');
        });

        function openSettings() {
            document.getElementById('settingsPanel').classList.add('show');
        }

        function closeSettings() {
            document.getElementById('settingsPanel').classList.remove('show');
            
            // 应用设置
            state.language = document.getElementById('languageSelect').value;
            state.maxNumber = parseInt(document.getElementById('rangeSelect').value);
            state.volume = parseInt(document.getElementById('volumeSlider').value) / 100;
            
            initGame();
        }

        // ========== 初始化 ==========
        function initAudio() {
            if (!state.audioContext) {
                state.audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        document.getElementById('startBtn').addEventListener('click', () => {
            initAudio();
            
            document.getElementById('loadingScreen').style.display = 'none';
            state.initialized = true;
            initGame();

            // 播放欢迎语音
            setTimeout(() => {
                if (window.speechSynthesis) {
                    const welcome = new SpeechSynthesisUtterance('欢迎来到数字世界！');
                    welcome.lang = 'zh-CN';
                    welcome.volume = state.volume;
                    speechSynthesis.speak(welcome);
                }
            }, 300);
        });

        // 模式切换按钮
        document.getElementById('learnModeBtn').addEventListener('click', () => switchMode('learn'));
        document.getElementById('practiceModeBtn').addEventListener('click', () => switchMode('practice'));

        // 防止误触
        document.addEventListener('touchmove', (e) => {
            if (e.target.closest('.number-btn, .btn, .settings-btn')) {
                e.preventDefault();
            }
        }, { passive: false });

        // 初始化设置
        document.getElementById('languageSelect').value = state.language;
        document.getElementById('rangeSelect').value = state.maxNumber;
        document.getElementById('volumeSlider').value = state.volume * 100;
    </script>
</body>
</html>
